function resetNetRemoteStates() {
  netRemoteStates = [0, 1, 2, 3].map(() => ({ l:0, r:0, u:0, uh:0, dh:0, p:0, k:0, b:0, s:0, f:0 }));
}
let netOutState = { l:0, r:0, u:0, uh:0, dh:0, p:0, k:0, b:0, s:0, f:0 };
let netLastSend = 0, netLastInputStr = '';

let netLobbyList = [];

  try { return localStorage.getItem('cc_pname') || ('Player_' + Math.floor(Math.random() * 899 + 100)); } catch(e) { return 'Player'; }
})();

function getSocketUrl() {
  if (typeof window !== 'undefined' && window.location) {
    if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
      return window.location.origin;
    }
  }
  try { return localStorage.getItem('cc_server_url') || 'http://localhost:3000'; } catch(e) { return 'http://localhost:3000'; }
}

function connectOnline() {
  if (typeof io !== 'function') {
    netStatusMsg = 'Socket.io script not loaded';
    return;
  }
  if (netSocket) {
    if (!netSocket.connected && !netConnecting) {
      netConnecting = true;
      netSocket.connect();
    }
    return;
  }
  netConnecting = true;
  netSocket = io(getSocketUrl(), {
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: 20,
    reconnectionDelay: 1000,
    timeout: 8000
  });

  netSocket.on('connect', () => {
    netConnected = true;
    netConnecting = false;
    netStatusMsg = 'Connected to Render';
    refreshOnlineLobbies();
  });
  netSocket.on('disconnect', () => {
    netConnected = false;
    netConnecting = false;
    netStatusMsg = 'Connection lost';
  });
  netSocket.on('connect_error', () => {
    netConnected = false;
    netConnecting = false;
    netStatusMsg = 'Could not reach server';
  });
  netSocket.on('lobby-list', list => {
    netLobbyList = Array.isArray(list) ? list : [];
  });
  netSocket.on('lobby-joined', data => {
    netPlayerIndex = data.playerIndex;
    netRoom = data.lobby;
    netMenuState = 'room';
    netLocalChar = netRoom.players[netPlayerIndex]?.character ?? netLocalChar;
    sfx.ok();
  });
  netSocket.on('lobby-state', room => {
    if (!netGameActive && netRoom && room.code === netRoom.code) {
      netRoom = room;
    }
  });
  netSocket.on('lobby-error', msg => {
    netStatusMsg = String(msg || 'Lobby error');
    sfx.blk();
  });
  netSocket.on('lobby-closed', () => {
    netGameActive = false;
    netRoom = null;
    netMenuState = 'main';
    netStatusMsg = 'Lobby closed by opponent';
    if (st === 'fight' || st === 'vs') {
      st = 'online';
      setTrack('title');
    }
    sfx.blk();
  });
  netSocket.on('game-start', data => {
    netPlayerIndex = data.playerIndex;
    netGameActive = true;
    resetNetRemoteStates();
    netOutState = { l:0, r:0, u:0, uh:0, dh:0, p:0, k:0, b:0, s:0, f:0 };
    netLastSend = 0;
    netLastInputStr = '';
    const roster = Array.isArray(data.characters) ? data.characters : [0, 0];
    const n = Math.min(4, Math.max(2, roster.length));
    two = (n === 2);
    slots = [0, 1, 2, 3].map(i => i < n
      ? ({ st: 'HMN', cur: roster[i], char: roster[i], lock: true, ent: i })
      : ({ st: 'OFF', cur: 0, char: 0, lock: false, ent: i })
    );
    sel = roster.slice(0, n);
    mapI = Number.isInteger(data.mapIndex) ? data.mapIndex : 0;
    mapSel = mapI;
    sfx.ok();
    vsStart();
  });
  netSocket.on('player-input', data => {
    const idx = data.playerIndex;
    if (netGameActive && idx !== netPlayerIndex && idx >= 0 && idx < 4 && data.input) {
      const inp = data.input;
      const r = netRemoteStates[idx];
      r.l = inp.l ? 1 : 0;
      r.r = inp.r ? 1 : 0;
      r.b = inp.b ? 1 : 0;
      r.uh = inp.uh ? 1 : 0;
      r.dh = inp.dh ? 1 : 0;
      if (inp.u) r.u = 1;
      if (inp.p) r.p = 1;
      if (inp.k) r.k = 1;
      if (inp.s) r.s = 1;
      if (inp.f) r.f = 1;
    }
  });
  netSocket.on('state-sync', data => {
    if (netGameActive && netPlayerIndex !== 0) {
      netApplyStateSync(data);
    }
  });
  netSocket.on('return-lobby', room => {
    netGameActive = false;
    resetNetRemoteStates();
    netRoom = room;
    if (room && Number.isInteger(room.playerIndex)) {
      netPlayerIndex = room.playerIndex;
    }
    st = 'online';
    netMenuState = 'room';
    setTrack('title');
    sfx.ok();
  });
}

function refreshOnlineLobbies() {
  if (!netSocket?.connected) {
    connectOnline();
    return;
  }
  netSocket.emit('list-lobbies');
}

function openOnlineMenu() {
  st = 'online';
  if (netRoom) {
    netMenuState = 'room';
  } else {
    netMenuState = 'main';
  }
  connectOnline();
  refreshOnlineLobbies();
  sfx.ok();
}

function closeOnlineMenu() {
  if (netSocket && netRoom) netSocket.emit('leave-lobby');
  netRoom = null;
  netGameActive = false;
  st = 'title';
  tT = 300;
  setTrack('title');
  sfx.sel();
}

function promptPlayerName() {
  const n = prompt('Enter your fighter name (up to 16 characters):', netPlayerName);
  if (n && n.trim()) {
    netPlayerName = safePName(n.trim());
    try { localStorage.setItem('cc_pname', netPlayerName); } catch(e) {}
    sfx.ok();
  }

function safePName(v) {
  return String(v || 'Player').replace(/[<>]/g, '').trim().slice(0, 16) || 'Player';
}

function netQuickMatch() {
  if (!netSocket?.connected) {
    connectOnline();

  netSocket.emit('quick-match', { name: netPlayerName, character: netLocalChar });

}

function createOnlineLobby() {
  if (!netSocket?.connected) {
    connectOnline();
    netStatusMsg = 'Connecting to Render…';
    return;
  }
  netSocket.emit('create-lobby', { name: netPlayerName, character: netLocalChar });

function promptJoinCode() {
  const c = prompt('Enter 6-character lobby code:');
  if (c && c.trim()) {

  }

  if (!netSocket?.connected) {
    connectOnline();
    netStatusMsg = 'Connecting to Render…';
    return;
  }
  netSocket.emit('join-lobby', {
    code: String(code || '').toUpperCase().trim(),
    name: netPlayerName,
    character: netLocalChar
  });

function leaveOnlineLobby() {
  if (netSocket && netRoom) netSocket.emit('leave-lobby');
  netRoom = null;
  netGameActive = false;
  netMenuState = 'main';
  refreshOnlineLobbies();
  sfx.sel();
}

function copyLobbyCode() {
  if (netRoom && navigator.clipboard) {
    navigator.clipboard.writeText(netRoom.code).then(() => {
      netCopied = true;
      netCopyTimer = 90;
      sfx.ok();
    }).catch(() => {
      prompt('Lobby code:', netRoom.code);
    });
  } else if (netRoom) {
    prompt('Lobby code:', netRoom.code);
  }

function cycleLocalChar(delta) {
  const n = CH.length;
  netLocalChar = (netLocalChar + delta + n) % n;
  if (netSocket?.connected && netRoom) {
    netSocket.emit('char-select', { character: netLocalChar });
  }
  sfx.sel();
}

function cycleStage(delta) {
  if (!netRoom || netPlayerIndex !== 0) return;
  const cur = Number.isInteger(netRoom.mapIndex) ? netRoom.mapIndex : 7;
  const next = (cur + delta + 8) % 8; // 0..6 stages, 7 = Random
  netRoom.mapIndex = next;
  if (netSocket?.connected) {
    netSocket.emit('map-select', { mapIndex: next });
  }
  sfx.sel();
}

function startOnlineGame() {
  if (netSocket?.connected && netRoom && netPlayerIndex === 0 && netRoom.players.length >= 2) {
    netSocket.emit('start-game', { code: netRoom.code });
    sfx.ok();
  }
}

function netReturnToLobby() {
  if (netSocket?.connected && netRoom) {
    netSocket.emit('return-lobby');
  } else {
    netGameActive = false;
    st = 'online';
    netMenuState = 'main';
    setTrack('title');
  }
}

function netSendInput(v) {
  if (!netGameActive || !netSocket?.connected) return;
  const now = performance.now();
  netOutState.l = v.l ? 1 : 0;
  netOutState.r = v.r ? 1 : 0;
  netOutState.b = v.b ? 1 : 0;
  netOutState.uh = v.uh ? 1 : 0;
  netOutState.dh = v.dh ? 1 : 0;
  if (v.u) netOutState.u = 1;
  if (v.p) netOutState.p = 1;
  if (v.k) netOutState.k = 1;
  if (v.s) netOutState.s = 1;
  if (v.f) netOutState.f = 1;

  const currentStr = `${netOutState.l},${netOutState.r},${netOutState.u},${netOutState.p},${netOutState.k},${netOutState.b},${netOutState.s},${netOutState.f},${netOutState.uh},${netOutState.dh}`;
  const changed = currentStr !== netLastInputStr;

  if (changed || (now - netLastSend >= 18)) {
    netSocket.emit('player-input', { input: { ...netOutState }, fNum: fT });
    netLastSend = now;
    netLastInputStr = currentStr;
    netOutState.u = 0;
    netOutState.p = 0;
    netOutState.k = 0;
    netOutState.s = 0;
    netOutState.f = 0;
  }
}

function netSendStateSync() {
  if (!netGameActive || !netSocket?.connected || netPlayerIndex !== 0 || !F || F.length < 2) return;
  const fighters = F.map(f => ({ x: Math.round(f.x), y: Math.round(f.y), vx: +f.vx.toFixed(2), vy: +f.vy.toFixed(2), hp: f.hp, sm: f.sm, at: f.at, stn: f.stun }));
  netSocket.emit('state-sync', { fighters, fNum: fT });
}

function netApplyStateSync(data) {
  if (!netGameActive || netPlayerIndex === 0 || !F || !data) return;
  const list = data.fighters;
  if (!Array.isArray(list)) return;
  list.forEach((pf, i) => {
    if (!pf || !F[i]) return;
    F[i].hp = pf.hp; F[i].sm = pf.sm;
    if (Math.abs(F[i].x - pf.x) > 18) F[i].x = pf.x; else F[i].x += (pf.x - F[i].x) * 0.35;
    if (Math.abs(F[i].y - pf.y) > 15) F[i].y = pf.y; else F[i].y += (pf.y - F[i].y) * 0.35;
  });
}

    bevel(74, 156, 235, 18, '#3df2ff', '#1a80b8');

  }
}
